# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DEL COMPONENTE DE ACCESO A DATOS
# Módulo: Acceso a Datos | UD6: Programación de Componentes
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────────
# BASE DE DATOS ACTIVA
# Valores: mysql | mongo
# Cambia este valor para alternar entre bases de datos
# ─────────────────────────────────────────────────────────────────────────────────
db.active=mysql

# ─────────────────────────────────────────────────────────────────────────────────
# CONFIGURACIÓN MYSQL
# ─────────────────────────────────────────────────────────────────────────────────
mysql.url=jdbc:mysql://localhost:3306/tienda
mysql.user=root
mysql.password=TU_PASSWORD_AQUI

# ─────────────────────────────────────────────────────────────────────────────────
# CONFIGURACIÓN MONGODB
# Para MongoDB Atlas, usa el formato:
# mongo.uri=mongodb+srv://usuario:password@cluster.mongodb.net/?retryWrites=true&w=majority
# ─────────────────────────────────────────────────────────────────────────────────
mongo.uri=mongodb://localhost:27017
mongo.database=tienda
mongo.collection=productos
